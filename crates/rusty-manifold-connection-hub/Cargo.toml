[package]
name = "rusty-manifold-connection-hub"
description = "Durable transport-neutral controller, session, UI-surface, and derivative-lease authority for standalone connection hubs."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rusty-manifold-admission = { path = "../rusty-manifold-admission" }
rusty-manifold-broker-product = { path = "../rusty-manifold-broker-product" }
rusty-manifold-model = { path = "../rusty-manifold-model", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
